[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlm-proxy"
version = "1.2.2"
description = "NotebookLM client library with MCP and OpenAI interfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Le Anh Tuan", email = "latuannetnam@gmail.com" }
]
maintainers = [
    { name = "Le Anh Tuan", email = "latuannetnam@gmail.com" }
]
keywords = ["mcp", "notebooklm", "google", "ai", "research", "openai", "proxy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core dependencies
    "httpx>=0.27.0",
    "websocket-client>=1.6.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    # OpenAI proxy dependencies
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "fastmcp>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    # LangChain + LangGraph
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-huggingface>=0.1",
    "langgraph>=0.2",
    "langgraph-checkpoint>=2.0",
    # Response cache (embedding + similarity)
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
cache-gpu = ["torch>=2.0"]
anthropic = ["langchain-anthropic>=0.3"]
ollama = ["langchain-ollama>=0.3"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "nlm-proxy[dev]",
]

[project.scripts]
nlm-proxy = "nlm_proxy.cli:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/nlm_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mcp: requires mcp extras",
    "openai: requires openai extras",
]
