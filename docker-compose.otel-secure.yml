services:
  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: nlm-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: nlm_traces
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: nlm-otel-collector
    ports:
      - "4317:4317"  # OTLP gRPC (TLS)
      - "4318:4318"  # OTLP HTTP (TLS)
      - "13133:13133"  # Health check
    volumes:
      - ./docker/otel/config-secure.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Mount TLS certificates
      - ./docker/otel/certs:/etc/otelcol-contrib/certs:ro
    env_file:
      # Load environment variables from docker/otel/.env
      - ./docker/otel/.env
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: nlm-grafana
    ports:
      - "3000:3000"  # Grafana UI
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  grafana_data:
